events { worker_connections 1024; }
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    upstream backend   { server backend:8000; }
    upstream ml_engine { server ml_engine:8001; }
    upstream frontend  { server frontend:5173; }

    server {
        listen 80;
        server_name localhost;
        client_max_body_size 10M;

        location /api/    { proxy_pass http://backend;   proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 120s; }
        location /admin/  { proxy_pass http://backend;   proxy_set_header Host $host; }
        location /static/ { alias /var/www/static/; expires 30d; }
        location /ml/     { rewrite ^/ml/(.*)$ /$1 break; proxy_pass http://ml_engine; proxy_read_timeout 30s; }
        location /        { proxy_pass http://frontend;  proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
    }
}
