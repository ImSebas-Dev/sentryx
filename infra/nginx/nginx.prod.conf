# ══════════════════════════════════════════════════════════
#  Sentryx v2 — nginx de PRODUCCIÓN
#  - HTTP solo redirige a HTTPS.
#  - TLS 1.2/1.3 con el certificado de infra/nginx/certs/ (no se versiona).
#  - HSTS, CSP estricta en el panel y límite de peticiones por IP.
#  Cambia server_name por tu dominio.
# ══════════════════════════════════════════════════════════
events { worker_connections 1024; }
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;

    limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=20r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    upstream backend  { server backend:8000; }
    upstream frontend { server frontend:80; }

    # ── HTTP → HTTPS ──────────────────────────────────────
    server {
        listen 80 default_server;
        server_name _;
        location / { return 301 https://$host$request_uri; }
    }

    # ── HTTPS ─────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name sentryx.example.com;   # ← tu dominio

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_tickets off;

        client_max_body_size 10M;
        client_body_timeout  30s;
        limit_conn perip 50;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        location ~ /\. { deny all; return 404; }

        location /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://backend;
            proxy_read_timeout 120s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        # Si cambiaste DJANGO_ADMIN_URL, cambia también esta ruta. Puedes
        # restringirla a la IP de tu oficina con: allow 1.2.3.4; deny all;
        location /admin/ {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /static/ { alias /var/www/static/; expires 30d; }

        # Panel React: CSP estricta (sin scripts inline ni de otros dominios)
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
        }
    }
}
