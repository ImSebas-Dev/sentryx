[pytest]
# --ds tiene prioridad sobre la variable DJANGO_SETTINGS_MODULE del contenedor
# (que apunta a development). No quitarlo: sin él las pruebas usan Redis real,
# throttling y Celery asíncrono.
python_files  = tests/test_*.py **/test_*.py
python_classes = Test*
python_functions = test_*
addopts = --ds=config.settings.testing --tb=short --strict-markers -q
markers =
    slow: pruebas lentas
    integration: pruebas de integración
