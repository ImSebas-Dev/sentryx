# ══════════════════════════════════════════════════════════
#  Sentryx v2 — Servicios base
#
#  Desarrollo:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up   (make up)
#  Producción:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
#  Seguridad: solo nginx publica puertos. La base de datos, Redis, el backend y
#  el motor ML solo son accesibles dentro de la red interna de Docker. No hay
#  contraseñas por defecto: si falta una en .env, Compose se niega a arrancar.
# ══════════════════════════════════════════════════════════
services:

  # ── PostgreSQL ──────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: sentryx_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentryx}
      POSTGRES_USER: ${POSTGRES_USER:-sentryx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      # scram-sha-256 en lugar de md5 para las contraseñas de la base de datos
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentryx}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentryx_net

  # ── Redis ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sentryx_redis
    restart: always
    # La contraseña llega por variable de entorno, no en la línea de comandos
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --protected-mode yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentryx_net

  # ── Django Backend ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentryx_backend
    restart: always
    command: >
      sh -c "python manage.py migrate --noinput &&
              python manage.py collectstatic --noinput &&
              gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
              --limit-request-line 8190 --limit-request-fields 100"
    env_file: .env
    volumes:
      - static_files:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Host: $${DJANGO_ALLOWED_HOSTS%%,*}\" http://localhost:8000/api/v1/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sentryx_net

  # ── FastAPI ML Engine (análisis de correos) ─────────────────────
  ml_engine:
    build:
      context: ./ml_engine
      dockerfile: Dockerfile
    container_name: sentryx_ml
    restart: always
    command: uvicorn api.main:app --host 0.0.0.0 --port 8001 --workers 2
    env_file: .env
    environment:
      # Script usado por POST /admin/retrain (reentrenamiento desde Celery)
      - ML_TRAIN_SCRIPT=/opt/sentryx/scripts/ml/train_models.py
    volumes:
      - ml_models:/app/models/trained
      - ./scripts/ml:/opt/sentryx/scripts/ml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sentryx_net

  # ── Celery Worker ───────────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentryx_celery
    restart: always
    command: celery -A config worker --loglevel=info --concurrency=2 -Q default,threat_intel,alerts
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentryx_net

  # ── Celery Beat (scheduler para feeds TI) ──────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentryx_beat
    restart: always
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentryx_net

  # ── React Frontend ──────────────────────────────────────────────
  # Base: servidor de Vite (desarrollo). docker-compose.prod.yml usa el build
  # estático (target production) servido por nginx.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: sentryx_frontend
    restart: always
    networks:
      - sentryx_net

  # ── Hub de la Red de alerta (opcional: docker compose --profile hub up) ──
  community_db:
    image: postgres:16-alpine
    container_name: sentryx_community_db
    profiles: ["hub"]
    restart: always
    environment:
      POSTGRES_DB: community_hub
      POSTGRES_USER: community_hub
      # Sin valor el contenedor no arranca (postgres rechaza la contraseña vacía)
      POSTGRES_PASSWORD: ${COMMUNITY_DB_PASSWORD:-}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - community_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U community_hub"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentryx_net

  community_hub:
    build:
      context: ./community_hub
      dockerfile: Dockerfile
    container_name: sentryx_community_hub
    profiles: ["hub"]
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8100 --proxy-headers
    environment:
      COMMUNITY_HUB_DATABASE_URL: postgresql+psycopg2://community_hub:${COMMUNITY_DB_PASSWORD}@community_db:5432/community_hub
      COMMUNITY_HUB_OPERATOR_KEY: ${COMMUNITY_HUB_OPERATOR_KEY:-}
      COMMUNITY_K_ANONYMITY: ${COMMUNITY_K_ANONYMITY:-2}
      COMMUNITY_DAILY_LIMIT: ${COMMUNITY_DAILY_LIMIT:-1000}
    # Publicar el hub solo detrás de un proxy con HTTPS: los nodos envían su key
    ports:
      - "127.0.0.1:8100:8100"
    depends_on:
      community_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8100/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sentryx_net

  # ── Nginx Reverse Proxy ─────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: sentryx_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/var/www/static:ro
    depends_on:
      - backend
      - frontend
    networks:
      - sentryx_net

volumes:
  postgres_data:
  redis_data:
  static_files:
  ml_models:
  community_db_data:

networks:
  sentryx_net:
    driver: bridge
