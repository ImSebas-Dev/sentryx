services:

  # ── PostgreSQL ──────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: sentryx_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentryx}
      POSTGRES_USER: ${POSTGRES_USER:-sentryx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentryx_dev_pwd}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentryx}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentryx_net

  # ── Redis ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sentryx_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-sentryx_redis_pwd}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-sentryx_redis_pwd}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentryx_net

  # ── Django Backend ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentryx_backend
    restart: always
    command: >
      sh -c "python manage.py migrate --noinput &&
              python manage.py collectstatic --noinput &&
              gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    env_file: .env
    volumes:
      - ./backend:/app
      - static_files:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sentryx_net

  # ── FastAPI ML Engine (análisis de correos) ─────────────────────
  ml_engine:
    build:
      context: ./ml_engine
      dockerfile: Dockerfile
    container_name: sentryx_ml
    restart: always
    command: uvicorn api.main:app --host 0.0.0.0 --port 8001 --workers 2
    env_file: .env
    environment:
      # Script usado por POST /admin/retrain (reentrenamiento desde Celery)
      - ML_TRAIN_SCRIPT=/opt/sentryx/scripts/ml/train_models.py
    volumes:
      - ./ml_engine:/app
      - ml_models:/app/models/trained
      - ./scripts/ml:/opt/sentryx/scripts/ml:ro
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sentryx_net

  # ── Celery Worker ───────────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentryx_celery
    restart: always
    command: celery -A config worker --loglevel=info --concurrency=2 -Q default,threat_intel,alerts
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentryx_net

  # ── Celery Beat (scheduler para feeds TI) ──────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentryx_beat
    restart: always
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentryx_net

  # ── React Frontend ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: sentryx_frontend
    restart: always
    environment:
      - VITE_API_URL=http://localhost/api/v1
      - VITE_ML_URL=http://localhost/ml
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - sentryx_net

  # ── Nginx Reverse Proxy ─────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: sentryx_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/var/www/static:ro
    depends_on:
      - backend
      - ml_engine
      - frontend
    networks:
      - sentryx_net

volumes:
  postgres_data:
  redis_data:
  static_files:
  ml_models:

networks:
  sentryx_net:
    driver: bridge
