# ══════════════════════════════════════════════════════════════════
#  Sentryx v2 — Regla SIGMA: Campaña de phishing masivo por correo
#  MITRE ATT&CK: T1566.001 (Spearphishing Link)
# ══════════════════════════════════════════════════════════════════

title: Campaña de phishing masivo detectada desde mismo dominio
id: sentryx-v2-001
status: stable
description: >
    Detecta una campaña de phishing activa cuando se registran 3 o más
    correos con score >= 70 (phishing) provenientes del mismo dominio de
    remitente en una ventana de 60 minutos. Indica una campaña coordinada
    contra la organización.

references:
    - https://attack.mitre.org/techniques/T1566/001/

author: Sentryx Team
date: 2026-01-01

tags:
    - attack.initial_access
    - attack.t1566.001
    - sentryx.critical
    - email.phishing.campaign

logsource:
    product: sentryx
    service: alerts

detection:
    phishing_alert:
        phishing_type|contains:
            - spear
            - whaling
            - bec
            - clone
            - generic
        risk_score|gte: 70
        status: new

    timeframe: 
        last: 60m
    condition: phishing_alert | count(sender_domain) by sender_domain >= 3

fields:
    - sender_domain
    - risk_score
    - phishing_type
    - mitre_technique
    - detected_at

falsepositives:
    - Correos legítimos de marketing masivo de un mismo dominio
    - Pruebas de phishing autorizadas por el equipo de seguridad

level: critical

sentryx:
    output_severity: CRITICAL
    auto_create_campaign: true
    auto_create_incident: true
    incident_title: "Campaña de phishing activa desde {sender_domain}"
    notify_admin: true
    mitre_tactic: "Initial Access"
    mitre_techniques:
        - T1566.001
    recommendation: >
        1. Añadir el dominio del remitente a la lista negra de IOCs.
        2. Notificar a todos los usuarios afectados de la campaña.
        3. Bloquear el dominio en el filtro de correo corporativo.
        4. Verificar si algún usuario interactuó con los enlaces del correo.
        5. Consultar PhishTank y VirusTotal con las URLs encontradas.
