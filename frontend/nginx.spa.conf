# Sirve el build estático del panel. Las cabeceras de seguridad (CSP, HSTS...)
# las pone el nginx de entrada (infra/nginx/nginx.prod.conf).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Archivos con hash en el nombre: caché larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Nunca servir archivos ocultos (.env, .git...)
    location ~ /\.(?!well-known/) { deny all; return 404; }

    # Rutas de React Router → index.html (sin caché, para recibir cada versión nueva)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
